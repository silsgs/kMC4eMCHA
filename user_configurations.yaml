#**************************************************************************
# Active simulation configuration
#**************************************************************************

#-------------------------------------------------------------------------------------------------------------------------------
simulation_name: testing  # Name used for output folder: results_<simulation_name>
#-------------------------------------------------------------------------------------------------------------------------------
simulation_type: 5                    # Supported values: 0, 1, 5, 6, 7, 10
#-------------------------------------------------------------------------------------------------------------------------------
save_results: 1                       # 0: do not create output folder, 1: create/save outputs
#-------------------------------------------------------------------------------------------------------------------------------
setting_seed: 1                       # 0: random run, 1: reproducible run
#-------------------------------------------------------------------------------------------------------------------------------

#**************************************************************************
# System size and initial state
#**************************************************************************

#-------------------------------------------------------------------------------------------------------------------------------
n_steps: 1000                         # Total number of simulation steps
#-------------------------------------------------------------------------------------------------------------------------------
positions: 5                         # Number of discrete spatial points along the molecule
#-------------------------------------------------------------------------------------------------------------------------------
number_spins: 1000                    # Total number of electrons/spins
#-------------------------------------------------------------------------------------------------------------------------------
spin_ratio: 1                         # Ratio between spin populations; 1 gives equal alpha/beta counts
#-------------------------------------------------------------------------------------------------------------------------------
alpha_init_position: 3                # Initial spatial position of alpha-spin electrons
#-------------------------------------------------------------------------------------------------------------------------------
beta_init_position: 3                 # Initial spatial position of beta-spin electrons
#-------------------------------------------------------------------------------------------------------------------------------

#**************************************************************************
# Transport model
#**************************************************************************

#-------------------------------------------------------------------------------------------------------------------------------
helix_twisting: -1                    # Chirality parameter, -1: left; 1: right
#-------------------------------------------------------------------------------------------------------------------------------
emcha_effect: 30                        # Strength of spin/chirality contribution
#-------------------------------------------------------------------------------------------------------------------------------
diff_coefficient: 0.5                 # Diffusion coefficient / attempted hopping scale
#-------------------------------------------------------------------------------------------------------------------------------
Temperature: 300                      # Temperature in K
#-------------------------------------------------------------------------------------------------------------------------------
voltage_magnitude: 1                  # Used for default dV and plot labels; voltage sweep range is in main.py
#-------------------------------------------------------------------------------------------------------------------------------
